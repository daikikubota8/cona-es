  const ga=i=>avg(g.map(n=>S.st[n].s[i]));h+=`<tr class="area"><td colspan="3">${a}（${g.length}店舗）平均</td><td class="${cls(ga(0),S.av[0])}">${f1(ga(0))}</td><td></td><td></td><td>${f1(ga(2))}%</td>${ITEMS.map((_,i)=>`<td class="${cls(ga(i+3),S.av[i+3])}">${f1(ga(i+3))}</td>`).join("")}</tr>`+g.map(x=>row(x,S,P)).join("")});
 const miss=Object.values(AREAS).flat().filter(n=>!S.st[n]);
 h+=`</table></div><div class="note">見出し（総合・回答率・各項目）クリックでエリア内の並び順とブランド順位が切り替わります。</div>${miss.length?`<div class="note">データ未登録：${miss.join("、")}</div>`:""}</div>`;$("area").innerHTML=h}
function radar(series){const W=340,c=170,R=120,N=ITEMS.length,pt=(i,v)=>{const a=-Math.PI/2+2*Math.PI*i/N,r=R*Math.max(0,v-40)/60;return[c+r*Math.cos(a),c+r*Math.sin(a)]};
 let g="";[50,60,70,80,90,100].forEach(v=>g+=`<polygon points="${ITEMS.map((_,i)=>pt(i,v).join(",")).join(" ")}" fill="none" stroke="#ddd"/>`);
 ITEMS.forEach((t,i)=>{const[x,y]=pt(i,108);g+=`<text x="${x}" y="${y}" font-size="10" text-anchor="middle" dominant-baseline="middle">${t}</text>`});
 series.forEach(s=>g+=`<polygon points="${s.v.map((v,i)=>pt(i,v).join(",")).join(" ")}" fill="${s.f}" stroke="${s.c}" stroke-width="2" ${s.d?'stroke-dasharray="5 3"':""}/>`);
 return`<svg viewBox="0 0 ${W} ${W}" width="100%" style="max-width:380px">${g}</svg><div class="legend">${series.map(s=>`<span style="border:2px ${s.d?"dashed":"solid"} ${s.c}">${s.n}</span>`).join("")}</div><div class="note">目盛：40〜100点</div>`}
let selStore=null;function openStore(n){selStore=n;document.querySelector('nav button[data-t="store"]').click()}
function renderStore(S,P){if(!selStore||!S.st[selStore])selStore=S.rk[0];const d=S.st[selStore],s=d.s,p=P&&P.st[selStore]?P.st[selStore].s:null;
 let h=`<div class="box"><label>店舗：<select id="ss">${Object.keys(AREAS).map(a=>`<optgroup label="${a}">${AREAS[a].filter(n=>S.st[n]).map(n=>`<option ${n==selStore?"selected":""}>${n}</option>`).join("")}</optgroup>`).join("")}</select></label></div>`;
 h+=`<div class="cards"><div class="card"><small>総合</small><b>${s[0]}点</b><small>ブランド平均 ${f1(S.av[0])} / 前回比 ${diff(s[0],p&&p[0])}</small></div><div class="card"><small>ブランド順位</small><b>${S.inR[selStore]}位</b><small>/${S.names.length}店舗（全社 ${s[1]}位）</small></div><div class="card"><small>回答率</small><b>${s[2]}%</b><small>ブランド平均 ${f1(S.av[2])}%</small></div></div>`;
 h+=`<div class="box"><h3>項目別スコア</h3>${legend}<div class="tw sk1"><table class="dt"><tr><th style="width:110px">項目</th><th style="width:60px">自店舗</th><th>スコア（｜＝ブランド平均）</th><th style="width:80px">ブランド平均</th><th style="width:60px">平均差</th><th style="width:70px">ブランド順位</th>${p?`<th style="width:60px">前回</th><th style="width:60px">前回比</th>`:""}</tr>${ITEMS.map((t,i)=>{const k=i+3,v=s[k],a=S.av[k],rk=S.rankBy(k)[selStore],c=v-a<=-5?"#f08a4b":v<a?"#f2c94c":v-a>=5?"#2e9e5b":"#5b8def";return`<tr><td class="n"><b>${t}</b></td><td class="${cls(v,a)}" style="font-size:15px"><b>${v}</b></td><td><div class="bar"><div style="width:${v}%;background:${c}"></div><i style="left:${a}%"></i></div></td><td>${f1(a)}</td><td>${diff(v,a)}</td><td>${rk}位</td>${p?`<td>${p[k]}</td><td>${diff(v,p[k])}</td>`:""}</tr>`}).join("")}</table></div></div>`;
 h+=`<div class="box"><h3>愛されMVP</h3><div class="mvp">${d.l.map((m,i)=>`<div><b>${i+1}位 ${m[0]}</b>（${m[1]}票）</div>`).join("")}</div></div>
 <div class="box"><h3>リーダーシップMVP</h3><div class="mvp">${d.L.map((m,i)=>`<div><b>${i+1}位 ${m[0]}</b>（${m[1]}票）<ul>${m[2].split("／").map(c=>`<li>${c}</li>`).join("")}</ul></div>`).join("")}</div></div>`;
 $("store").innerHTML=h;$("ss").onchange=e=>{selStore=e.target.value;render()}}
let trendItem=0;
function renderTrend(){const opts=[["総合",0],["回答率",2]].concat(ITEMS.map((t,i)=>[t,i+3]));
 const all=[...new Set(months.flatMap(m=>Object.keys(DATA[m].stores)))];const SS=months.map(stats);
 let h=`<div class="box"><h3>月別推移</h3><label>指標：<select id="ti">${opts.map(o=>`<option value="${o[1]}" ${o[1]==trendItem?"selected":""}>${o[0]}</option>`).join("")}</select></label>
 <div class="tw sk" style="margin-top:8px"><table><tr><th>エリア</th><th>店舗</th>${months.map(m=>`<th>${m}</th>`).join("")}<th>初回→最新</th></tr>
 <tr class="avg"><td colspan="2">ブランド平均</td>${SS.map(S=>`<td>${f1(S.av[trendItem])}</td>`).join("")}<td>${months.length>1?diff(SS.at(-1).av[trendItem],SS[0].av[trendItem]):"-"}</td></tr>`;
 Object.keys(AREAS).forEach(a=>AREAS[a].filter(n=>all.includes(n)).forEach(n=>{const vals=months.map(m=>DATA[m].stores[n]?DATA[m].stores[n].s[trendItem]:null);const k=vals.filter(v=>v!=null);
  h+=`<tr><td>${a.replace("エリア","")}</td><td class="n">${n}</td>${vals.map((v,j)=>`<td class="${v==null?"":cls(v,SS[j].av[trendItem])}">${v==null?"-":v}${j>0&&v!=null?"<br><small>"+diff(v,vals[j-1])+"</small>":""}</td>`).join("")}<td>${k.length>1?diff(k.at(-1),k[0]):"-"}</td></tr>`}));
 h+=`</table></div>${months.length<2?'<div class="note">現在は1か月分のみ登録。過去データを追加すると月別の推移・増減が表示されます。</div>':""}</div>`;
 $("trend").innerHTML=h;$("ti").onchange=e=>{trendItem=+e.target.value;renderTrend()}}
function render(){const S=stats(cur()),P=cmpM()?stats(cmpM()):null;renderSum(S,P);renderArea(S,P);renderStore(S,P);renderTrend();renderTend(S,P)}
months.forEach(m=>$("month").add(new Option(m,m)));$("month").value=months.at(-1);
function fillCmp(){const c=$("cmp");c.innerHTML="";c.add(new Option("なし",""));months.filter(m=>m<cur()).reverse().forEach(m=>c.add(new Option(m,m)));if(c.options.length>1)c.selectedIndex=1}
fillCmp();$("month").onchange=()=>{fillCmp();render()};$("cmp").onchange=render;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button,.sec").forEach(e=>e.classList.remove("on"));b.classList.add("on");$(b.dataset.t).classList.add("on")});
render();
</script></body></html>
